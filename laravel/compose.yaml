services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - ../datenbank:/var/www/datenbank:ro

  db:
    image: mariadb:11.8
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: ${DB_DATABASE:-fa_digital}
      MARIADB_USER: ${DB_USERNAME:-fa_digital}
      MARIADB_PASSWORD: ${DB_PASSWORD:-local-demo-password}
      TZ: Europe/Berlin
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - db-data:/var/lib/mysql

  node:
    image: node:22-bookworm
    profiles: [tools]
    working_dir: /app
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - vendor:/app/vendor:ro
    entrypoint: ["npm"]

volumes:
  db-data:
  vendor:
  node-modules:
