name: fa-digital

services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:80"
    environment:
      APP_NAME: FA-Digital
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_LOCALE: de
      APP_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: fa_digital
      DB_USERNAME: fa_digital
      DB_PASSWORD: local-demo-password
      DB_COLLATION: utf8mb4_german2_ci
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage
      # Die Migrationen lesen das Datenmodell direkt aus datenbank/ (01_schema.sql, 02_testdaten.sql, 03_sichten.sql)
      - ../datenbank:/var/www/datenbank:ro

  db:
    image: mariadb:11.8
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: fa_digital
      MARIADB_USER: fa_digital
      MARIADB_PASSWORD: local-demo-password
      # NOW() in den Sichten soll dieselbe Uhrzeit liefern wie PHP
      TZ: Europe/Berlin
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
  app-storage:
