name: fa-digital

services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:80"
    environment:
      APP_NAME: FA-Digital
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_LOCALE: de
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: fa_digital
      DB_USERNAME: fa_digital
      DB_PASSWORD: local-demo-password
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      DEMO_ADMIN_EMAIL: admin@fa-digital.local
      DEMO_ADMIN_PASSWORD: TestPasswort123!
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage

  db:
    image: mariadb:11.8
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: fa_digital
      MARIADB_USER: fa_digital
      MARIADB_PASSWORD: local-demo-password
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
  app-storage:
