<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><title>Werker arbeiten im Arbeitsgang Checklisten ab und liefern die Daten für das Werkszertifikat.</title>
<style>html,body{margin:0;background:#fff}svg{display:block;font-family:Verdana, sans-serif}</style></head>
<body><svg xmlns="http://www.w3.org/2000/svg" width="2070" height="1080" viewBox="0 0 2070 1080">
<defs><marker id="spitze" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#00305d"/></marker></defs>
<rect width="2070" height="1080" fill="#fff"/>
<text x="40" y="95" font-size="60" fill="#00305d">Werker arbeiten im Arbeitsgang Checklisten ab und</text><text x="40" y="167" font-size="60" fill="#00305d">liefern die Daten für das Werkszertifikat.</text>
<rect x="40" y="205" width="160" height="6" fill="#00305d"/>
<text x="46" y="290" font-size="36" fill="#00305d">Werker/innen</text>
<circle cx="160" cy="420" r="90" fill="#fff" stroke="#000e23" stroke-width="2"/><text x="160" y="420" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#00305d"><tspan x="160" dy="-12.5">Arbeitsgang</tspan><tspan x="160" dy="25">läuft</tspan></text>
<rect x="310" y="345" width="250" height="150" fill="#fff" stroke="#000e23" stroke-width="2"/><text x="435" y="420" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#00305d"><tspan x="435" dy="-25">Checkliste des</tspan><tspan x="435" dy="25">Arbeitsgangs</tspan><tspan x="435" dy="25">öffnen</tspan></text>
<rect x="620" y="345" width="250" height="150" fill="#fff" stroke="#000e23" stroke-width="2"/><text x="745" y="420" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#00305d"><tspan x="745" dy="-37.5">Prüfpunkte</tspan><tspan x="745" dy="25">abhaken und</tspan><tspan x="745" dy="25">Messwerte</tspan><tspan x="745" dy="25">erfassen</tspan></text>
<polygon points="920,420 1045,340 1170,420 1045,500" fill="#fff" stroke="#000e23" stroke-width="2"/><text x="1045" y="420" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#00305d"><tspan x="1045" dy="-12.5">Alles in der</tspan><tspan x="1045" dy="25">Toleranz?</tspan></text>
<rect x="920" y="560" width="250" height="150" fill="#fff" stroke="#000e23" stroke-width="2"/><text x="1045" y="635" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#00305d"><tspan x="1045" dy="-25">Abweichung</tspan><tspan x="1045" dy="25">erfassen und</tspan><tspan x="1045" dy="25">nacharbeiten</tspan></text>
<rect x="1230" y="345" width="250" height="150" fill="#fff" stroke="#000e23" stroke-width="2"/><text x="1355" y="420" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#00305d"><tspan x="1355" dy="-12.5">Checkliste</tspan><tspan x="1355" dy="25">abschließen</tspan></text>
<polyline points="250,420 310,420" fill="none" stroke="#00305d" stroke-width="1.6" marker-end="url(#spitze)"/>
<polyline points="560,420 620,420" fill="none" stroke="#00305d" stroke-width="1.6" marker-end="url(#spitze)"/>
<polyline points="870,420 920,420" fill="none" stroke="#00305d" stroke-width="1.6" marker-end="url(#spitze)"/>
<polyline points="1045,500 1045,560" fill="none" stroke="#00305d" stroke-width="1.6" marker-end="url(#spitze)"/>
<text x="1058" y="540" font-size="20" text-anchor="start" fill="#00305d">Nein</text>
<polyline points="920,635 745,635 745,495" fill="none" stroke="#00305d" stroke-width="1.6" marker-end="url(#spitze)"/>
<text x="832" y="622" font-size="20" text-anchor="middle" fill="#00305d">erneut prüfen</text>
<polyline points="1170,420 1230,420" fill="none" stroke="#00305d" stroke-width="1.6" marker-end="url(#spitze)"/>
<text x="1200" y="405" font-size="20" text-anchor="middle" fill="#00305d">Ja</text>
<line x1="30" y1="760" x2="2040" y2="760" stroke="#00305d" stroke-width="2" stroke-dasharray="2,5"/>
<text x="46" y="815" font-size="36" fill="#00305d">Meister/in</text>
<rect x="1230" y="850" width="250" height="150" fill="#fff" stroke="#000e23" stroke-width="2"/><text x="1355" y="925" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#00305d"><tspan x="1355" dy="-25">Prüfdaten aller</tspan><tspan x="1355" dy="25">Arbeitsgänge</tspan><tspan x="1355" dy="25">kontrollieren</tspan></text>
<rect x="1540" y="850" width="250" height="150" fill="#fff" stroke="#000e23" stroke-width="2"/><text x="1665" y="925" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#00305d"><tspan x="1665" dy="-25">Werkszertifikat</tspan><tspan x="1665" dy="25">erstellen und</tspan><tspan x="1665" dy="25">freigeben</tspan></text>
<circle cx="1940" cy="925" r="90" fill="#fff" stroke="#000e23" stroke-width="2"/><text x="1940" y="925" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#00305d"><tspan x="1940" dy="0">Ende</tspan></text>
<polyline points="1355,495 1355,850" fill="none" stroke="#00305d" stroke-width="1.6" marker-end="url(#spitze)"/>
<polyline points="1480,925 1540,925" fill="none" stroke="#00305d" stroke-width="1.6" marker-end="url(#spitze)"/>
<polyline points="1790,925 1850,925" fill="none" stroke="#00305d" stroke-width="1.6" marker-end="url(#spitze)"/>
</svg></body></html>
